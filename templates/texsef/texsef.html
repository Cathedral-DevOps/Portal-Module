<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>TexSEF Infrastructure Portal @ cdev</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/texsef/texsef.css') }}">
    </head>
    <body>
        <div class="wrapper">
            <form id="form">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Email/Username" required id="username">
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password/TexID" required id="password">
                </div>
                <div class="remember-forgot">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn" id="btn" >Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="https://cd-us.site">Register</a></p>
                </div>
                <div id="error-message" style="color: red; display: none;"></div>
            </form>
        </div>
        <script src="{{ url_for('static', filename='js/texsef/texsef.js') }}"></script>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFiUuROwzKQo2aojDa5RD89ZRLzCQZnmE",
            authDomain: "txsf-flutter.firebaseapp.com",
            projectId: "txsf-flutter",
            storageBucket: "txsf-flutter.firebasestorage.app",
            messagingSenderId: "665008585152",
            appId: "1:665008585152:web:6f6e911f5d437df0863025"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('form');
        const errorMsg = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const email = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const idToken = await userCredential.user.getIdToken();
                const response = await fetch('/api/login/txdash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: idToken })
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok && data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    throw new Error(data.error || 'Server validation failed');
                }
            } catch (error) {
                console.error('Login failed:', error);
                errorMsg.innerText = error.message || 'Unable to sign in. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
        </script>
    </body>

</html>
